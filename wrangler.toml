name = "spu-ict-portfolio"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

[vars]
ENVIRONMENT = "production"
PORTFOLIO_OWNER = "Tanakrit Thippawat"
UNIVERSITY = "Sripatum University"
MAJOR = "Information and Communication Technology (ICT)"

# -------------------------------------------------------------------
# Cloudflare D1 Database Binding
# -------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "spu_portfolio_db"
database_id = "00000000-0000-0000-0000-000000000000" # Replace with your actual D1 ID: npx wrangler d1 create spu_portfolio_db
migrations_dir = "./migrations"

# -------------------------------------------------------------------
# Cloudflare R2 Storage Bucket Binding (Images & PDF Certificates)
# -------------------------------------------------------------------
[[r2_buckets]]
binding = "PORTFOLIO_ASSETS"
bucket_name = "spu-portfolio-assets" # Replace with your actual R2 bucket name: npx wrangler r2 bucket create spu-portfolio-assets
